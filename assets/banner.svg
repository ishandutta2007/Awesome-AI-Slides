<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#ec4899" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.6"/>
    </linearGradient>

    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#e0e7ff"/>
      <stop offset="70%" stop-color="#c7d2fe"/>
      <stop offset="100%" stop-color="#a5b4fc"/>
    </linearGradient>

    <linearGradient id="cardGlow1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.08"/>
    </linearGradient>

    <linearGradient id="cardGlow2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.06"/>
    </linearGradient>

    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Filters for Glow Effects -->
    <filter id="blurFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
    <filter id="subtleBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <filter id="shadowFilter" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <style>
      @keyframes floatOrb1 {
        0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.55; }
        50% { transform: translate(40px, -25px) scale(1.15); opacity: 0.8; }
      }
      @keyframes floatOrb2 {
        0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.45; }
        50% { transform: translate(-35px, 20px) scale(1.2); opacity: 0.7; }
      }
      @keyframes cardFloat1 {
        0%, 100% { transform: translateY(0px) rotate(-4deg); }
        50% { transform: translateY(-12px) rotate(-2.5deg); }
      }
      @keyframes cardFloat2 {
        0%, 100% { transform: translateY(0px) rotate(4deg); }
        50% { transform: translateY(-10px) rotate(5.5deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.7; }
        50% { opacity: 1; }
      }
      @keyframes shimmerBorder {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 1200; }
      }

      .animated-orb1 { animation: floatOrb1 9s ease-in-out infinite; }
      .animated-orb2 { animation: floatOrb2 11s ease-in-out infinite; }
      .animated-card1 { animation: cardFloat1 6s ease-in-out infinite; }
      .animated-card2 { animation: cardFloat2 7s ease-in-out infinite; }
      .badge-glow { animation: pulseGlow 3s ease-in-out infinite; }

      .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGradient)"/>

  <!-- Subtle Tech Grid Background -->
  <g opacity="0.12">
    <line x1="100" y1="0" x2="100" y2="420" stroke="#6366f1" stroke-width="1"/>
    <line x1="250" y1="0" x2="250" y2="420" stroke="#6366f1" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="420" stroke="#6366f1" stroke-width="1"/>
    <line x1="550" y1="0" x2="550" y2="420" stroke="#6366f1" stroke-width="1"/>
    <line x1="700" y1="0" x2="700" y2="420" stroke="#6366f1" stroke-width="1"/>
    <line x1="850" y1="0" x2="850" y2="420" stroke="#6366f1" stroke-width="1"/>
    <line x1="1000" y1="0" x2="1000" y2="420" stroke="#6366f1" stroke-width="1"/>
    <line x1="0" y1="80" x2="1200" y2="80" stroke="#6366f1" stroke-width="1"/>
    <line x1="0" y1="170" x2="1200" y2="170" stroke="#6366f1" stroke-width="1"/>
    <line x1="0" y1="260" x2="1200" y2="260" stroke="#6366f1" stroke-width="1"/>
    <line x1="0" y1="350" x2="1200" y2="350" stroke="#6366f1" stroke-width="1"/>
  </g>

  <!-- Dynamic Glowing Mesh Orbs (Background layer) -->
  <g>
    <circle cx="200" cy="120" r="140" fill="#6366f1" filter="url(#blurFilter)" class="animated-orb1"/>
    <circle cx="1020" cy="300" r="160" fill="#ec4899" filter="url(#blurFilter)" class="animated-orb2"/>
    <circle cx="620" cy="200" r="120" fill="#3b82f6" opacity="0.3" filter="url(#blurFilter)"/>
  </g>

  <!-- Floating Presentation Wireframe Slide Cards (Background / Sides - Placed so they never overlap foreground text) -->
  <!-- Left floating slide card -->
  <g transform="translate(40, 90)" class="animated-card1">
    <rect width="200" height="130" rx="10" fill="url(#cardGlow1)" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.35"/>
    <rect x="18" y="20" width="65" height="10" rx="3" fill="#818cf8" opacity="0.6"/>
    <rect x="18" y="42" width="160" height="6" rx="2" fill="#cbd5e1" opacity="0.3"/>
    <rect x="18" y="55" width="140" height="6" rx="2" fill="#cbd5e1" opacity="0.2"/>
    <rect x="18" y="68" width="100" height="6" rx="2" fill="#cbd5e1" opacity="0.2"/>
    <!-- Mini slide chart wireframe -->
    <rect x="18" y="90" width="16" height="24" rx="2" fill="#6366f1" opacity="0.7"/>
    <rect x="40" y="80" width="16" height="34" rx="2" fill="#8b5cf6" opacity="0.7"/>
    <rect x="62" y="70" width="16" height="44" rx="2" fill="#ec4899" opacity="0.7"/>
    <circle cx="165" cy="95" r="14" fill="#3b82f6" opacity="0.3"/>
  </g>

  <!-- Right floating slide card -->
  <g transform="translate(950, 160)" class="animated-card2">
    <rect width="210" height="140" rx="10" fill="url(#cardGlow2)" stroke="#f472b6" stroke-width="1.5" stroke-opacity="0.35"/>
    <rect x="20" y="22" width="80" height="10" rx="3" fill="#f472b6" opacity="0.7"/>
    <!-- Simulated AI Slide prompt/bullet items -->
    <circle cx="26" cy="48" r="4" fill="#a78bfa"/>
    <rect x="38" y="45" width="150" height="6" rx="2" fill="#cbd5e1" opacity="0.35"/>
    <circle cx="26" cy="66" r="4" fill="#a78bfa"/>
    <rect x="38" y="63" width="130" height="6" rx="2" fill="#cbd5e1" opacity="0.3"/>
    <circle cx="26" cy="84" r="4" fill="#a78bfa"/>
    <rect x="38" y="81" width="110" height="6" rx="2" fill="#cbd5e1" opacity="0.25"/>
    <!-- Mini AI spark badge -->
    <rect x="20" y="105" width="70" height="18" rx="9" fill="#831843" opacity="0.6"/>
    <text x="55" y="117" fill="#fbcfe8" font-size="9" text-anchor="middle" class="font-sans" font-weight="600">⚡ AI DECK</text>
  </g>

  <!-- Border Gradient Accent -->
  <rect width="1196" height="416" x="2" y="2" rx="15" fill="none" stroke="url(#primaryGlow)" stroke-width="2"/>

  <!-- ================= FOREGROUND CONTENT (ALWAYS CRISP & UNOBSTRUCTED) ================= -->

  <!-- Top Pill Badge -->
  <g transform="translate(600, 62)" class="badge-glow">
    <rect x="-195" y="-16" width="390" height="32" rx="16" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2"/>
    <text x="0" y="5" text-anchor="middle" fill="#c7d2fe" font-size="12.5" font-weight="600" class="font-sans" letter-spacing="1">
      ✨ THE CURATED ECOSYSTEM • 2026 EDITION
    </text>
  </g>

  <!-- Main Hero Title -->
  <g transform="translate(600, 160)" filter="url(#shadowFilter)">
    <text x="0" y="0" text-anchor="middle" fill="url(#titleGradient)" font-size="54" font-weight="800" class="font-sans" letter-spacing="-1">
      Awesome AI Slides
    </text>
  </g>

  <!-- Hero Subtitle -->
  <g transform="translate(600, 212)">
    <text x="0" y="0" text-anchor="middle" fill="#94a3b8" font-size="19" font-weight="400" class="font-sans">
      The definitive list of AI presentation generators, automated deck builders &amp; open-source slide frameworks
    </text>
  </g>

  <!-- Secondary Meta Tagline -->
  <g transform="translate(600, 248)">
    <text x="0" y="0" text-anchor="middle" fill="#64748b" font-size="14" font-weight="500" class="font-mono">
      SaaS Platforms • Developer Frameworks • Markdown Ecosystem • Presentation Automation
    </text>
  </g>

  <!-- Bottom Interactive Pill Feature Badges -->
  <g transform="translate(600, 325)">
    <!-- Pill 1: Generative AI Decks -->
    <g transform="translate(-390, 0)">
      <rect x="-105" y="-18" width="210" height="36" rx="18" fill="url(#pillGrad)" stroke="#475569" stroke-width="1"/>
      <text x="0" y="5" text-anchor="middle" fill="#f1f5f9" font-size="13" font-weight="600" class="font-sans">
        🤖 Generative AI Decks
      </text>
    </g>

    <!-- Pill 2: Markdown to Slides -->
    <g transform="translate(-130, 0)">
      <rect x="-110" y="-18" width="220" height="36" rx="18" fill="url(#pillGrad)" stroke="#475569" stroke-width="1"/>
      <text x="0" y="5" text-anchor="middle" fill="#f1f5f9" font-size="13" font-weight="600" class="font-sans">
        ⚡ Markdown to Slides
      </text>
    </g>

    <!-- Pill 3: Enterprise SaaS Platforms -->
    <g transform="translate(130, 0)">
      <rect x="-115" y="-18" width="230" height="36" rx="18" fill="url(#pillGrad)" stroke="#475569" stroke-width="1"/>
      <text x="0" y="5" text-anchor="middle" fill="#f1f5f9" font-size="13" font-weight="600" class="font-sans">
        💼 Enterprise SaaS Tools
      </text>
    </g>

    <!-- Pill 4: Open-Source Frameworks -->
    <g transform="translate(390, 0)">
      <rect x="-110" y="-18" width="220" height="36" rx="18" fill="url(#pillGrad)" stroke="#475569" stroke-width="1"/>
      <text x="0" y="5" text-anchor="middle" fill="#f1f5f9" font-size="13" font-weight="600" class="font-sans">
        🛠️ Open-Source Engines
      </text>
    </g>
  </g>
</svg>
